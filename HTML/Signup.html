<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | FlowPilot AI</title>

    <link rel="stylesheet" href="../CSS/main.css">
    <link rel="stylesheet" href="../CSS/login.css">
    <link rel="stylesheet" href="../CSS/responsive.css">

     <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lora:ital,wght@0,400..700;1,400..700&family=Outfit:wght@100..900&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&display=swap"
        rel="stylesheet">

    <link rel="icon" href="../Images/logo-brand.png">

</head>

<body>

     <!-- =========================
            HEADER
    ========================== -->

    <header class="header">

        <div class="container">

            <div class="header-wrapper">

                <!-- Logo -->

                <a href="index.html" class="logo">
                    <img src="../Images/logo-brand.png" alt="FlowPilot AI Logo">
                    <h2>FlowPilot</h2>
                </a>

                <!-- Navigation -->

                <nav class="navbar">

                    <ul class="nav-list">

                        <li class="nav-item">
                            <a href="index.html" class="nav-link active">
                                Home
                            </a>
                        </li>
                       
                        <li class="nav-item">
                            <a href="blog.html" class="nav-link">
                                Blog
                            </a>
                        </li>

                        <li class="nav-item">
                            <a href="about.html" class="nav-link">
                                About
                            </a>
                        </li>

                    </ul>

                </nav>

                <!-- Header Actions -->

                <div class="header-actions">

                    <a href="login.html" class="login-btn">
                        Login
                    </a>

                    <a href="Signup.html" class="btn btn-primary">
                        Get Started Free
                    </a>

                </div>

                <button class="menu-btn">
                    ☰
                </button>


            </div>

        </div>

    </header>

    <main>

        <!-- =========================
                SIGNUP SECTION
        ========================== -->

        <section class="auth-section">

            <div class="container">

                <div class="auth-card signup-card">

                    <!-- Logo -->

                    <div class="auth-logo">

                        <img src="../Images/logo-brand.png" alt="FlowPilot AI Logo">

                    </div>

                    <!-- Heading -->

                    <header class="auth-header">

                        <h1 class="auth-title">
                            Create your account
                        </h1>

                        <p class="auth-description">
                            Start your free 14-day pro trial instantly.
                        </p>

                    </header>

                    <!-- Signup Form -->

                    <form class="auth-form">

                        <div class="form-group">

                            <label for="fullname">
                                Full Name
                            </label>

                            <input type="text" id="fullname" placeholder="Sarah Jenkins">

                        </div>

                        <div class="form-group">

                            <label for="work-email">
                                Work Email
                            </label>

                            <input type="email" id="work-email" placeholder="s.jenkins@flowpilot.ai">

                        </div>

                        <div class="form-group">

                            <label for="signup-password">
                                Password
                            </label>

                            <input type="password" id="signup-password" placeholder="At least 8 characters">

                        </div>


                        <div class="form-group">

                            <label for="company">
                                Company Name (Optional)
                            </label>

                            <input type="text" id="company" placeholder="FlowPilot AI Inc.">

                        </div>

                        <!-- Terms -->

                        <label class="terms-checkbox">

                            <input type="checkbox">

                            <span>

                                I agree to FlowPilot's

                                <a href="#">
                                    Terms of Service
                                </a>

                                and

                                <a href="#">
                                    Privacy Policy
                                </a>

                            </span>

                        </label>

                        <button type="submit" class="btn auth-btn">

                            Create Pro Account

                        </button>

                    </form>

                    <!-- Divider -->

                    <div class="auth-divider">

                        <span>

                            OR CONTINUE WITH

                        </span>

                    </div>

                    <!-- Social Login -->

                    <div class="social-login">

                        <button type="button" class="social-btn">

                            Google

                        </button>

                        <button type="button" class="social-btn">

                            GitHub

                        </button>

                    </div>

                    <!-- Footer -->

                    <p class="auth-footer">

                        Already have an account?

                        <a href="login.html">

                            Sign In

                        </a>

                    </p>

                </div>

            </div>

        </section>

    </main>

</body>

</html>
